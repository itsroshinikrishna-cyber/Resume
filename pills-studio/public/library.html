<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · Glance Pills Studio</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{--bg:#f4f3f6;--panel:#fff;--ink:#15131a;--muted:#6c6877;--line:#dcd8e4;--accent:#6b3df0}
  *{box-sizing:border-box;border-radius:0!important}
  body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:54px;flex-wrap:wrap}
  header h1{font-size:16px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0;padding:14px 0}
  header .sp{flex:1}
  .btn{border:1px solid var(--ink);background:#fff;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{background:#eee}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:4px 8px;font-size:12px}
  .btn.danger{color:#d6322e;border-color:#d6322e}
  main{max-width:1200px;margin:0 auto;padding:20px 16px}
  .tabs{display:flex;gap:0;margin-bottom:6px}
  .tabs button{border:1px solid var(--line);background:#fff;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;margin-left:-1px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .intro{color:var(--muted);margin:10px 0 14px;max-width:720px;line-height:1.5}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .drop{flex:1;min-width:240px;border:1px dashed var(--muted);padding:14px;text-align:center;color:var(--muted);background:#fff;cursor:pointer}
  .drop.over{background:#f1eef8;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .tile{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
  .tile .t{aspect-ratio:3/4;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile .t img{width:100%;height:100%;object-fit:contain;display:block}
  .tile.mascot .t{aspect-ratio:1/1}
  .tile .m{padding:8px 10px 4px;font-size:12px;min-width:0}
  .tile .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .m span{color:var(--muted)}
  .tile .a{display:flex;gap:6px;padding:6px 10px 10px;flex-wrap:wrap}
  .note{background:#fff7e0;border:1px solid #ecd58a;padding:10px 12px;margin-bottom:14px}
  .empty{color:var(--muted);padding:40px;text-align:center;background:#fff;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Glance Pills Studio</h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-k="image">Images</button><button data-k="mascot">Mascots</button><button data-k="generated">Generated</button>
  </div>
  <p class="intro" id="intro"></p>
  <div id="note"></div>
  <div class="bar" id="bar">
    <div class="drop" id="drop">Drop images here or click to upload</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="shared.js"></script>
<script>
PS.nav("library");
const INTRO = {
  image: "Shared photo library. Anyone can add images here and use them on any card in the Studio.",
  mascot: "Shared mascot library. Upload mascot variations as PNGs with transparent backgrounds; anyone can pick them for prompt cards.",
  generated: "Images made on the Generate page are saved here automatically."
};
let kind = new URLSearchParams(location.search).get("tab") || "image";
if (!INTRO[kind]) kind = "image";
const $ = s => document.querySelector(s);
let cfg;

function fmtDate(s){ return new Date(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

async function load(){
  $("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===kind));
  $("#intro").textContent=INTRO[kind];
  $("#bar").hidden = kind==="generated";
  const grid=$("#grid"); grid.innerHTML='<div class="empty">Loading…</div>';
  cfg = cfg || await PS.config();
  $("#note").innerHTML = cfg.offline ? '<div class="note"><b>Shared library is not connected.</b> Uploads and the library need the Vercel Blob storage and API (see README). The Studio still works in this browser only.</div>' : "";
  if (cfg.offline){ grid.innerHTML='<div class="empty">Library unavailable.</div>'; return; }
  let items=[]; try{ items=await PS.listAssets(kind); }catch(e){ grid.innerHTML=`<div class="empty">${PS.esc(e.message)}</div>`; return; }
  if(!items.length){ grid.innerHTML=`<div class="empty">No ${kind==="mascot"?"mascots":kind==="generated"?"generated images":"images"} yet.</div>`; return; }
  grid.innerHTML="";
  for(const it of items){
    const d=document.createElement("div"); d.className="tile"+(kind==="mascot"?" mascot":"");
    d.innerHTML=`<div class="t"><img loading="lazy" src="${PS.esc(it.url)}" alt=""></div>
      <div class="m"><b title="${PS.esc(it.name)}">${PS.esc(it.name)}</b><span>${fmtDate(it.uploadedAt)}</span></div><div class="a"></div>`;
    const a=d.querySelector(".a");
    const add=(label,fn,cls="")=>{const b=document.createElement("button");b.className="btn small "+cls;b.textContent=label;b.onclick=fn;a.appendChild(b);};
    if(kind!=="mascot") add("Use in Studio",()=>{location.href="./?new=image9&img="+encodeURIComponent(it.url);});
    add("Copy link",async()=>{try{await navigator.clipboard.writeText(new URL(it.url,location.href).href);PS.toast("Link copied");}catch(e){PS.toast(it.url);}});
    add("Delete",async()=>{ if(!confirm("Delete this from the shared library? Cards that use it will lose the image.")) return;
      try{ await PS.api("/api/assets?id="+encodeURIComponent(it.id),{method:"DELETE"}); d.remove(); PS.toast("Deleted"); }catch(e){ PS.toast(e.message); } },"danger");
    grid.appendChild(d);
  }
}
async function upload(files){
  let ok=0;
  for(const f of files){ try{ await PS.uploadFile(kind,f); ok++; PS.toast(`Uploading ${ok}/${files.length}…`); }catch(e){ PS.toast(e.message); } }
  if(ok) PS.toast(`${ok} uploaded`); load();
}
$("#tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return; kind=b.dataset.k; history.replaceState(null,"","?tab="+kind); load();};
$("#drop").onclick=()=>$("#file").click();
$("#file").onchange=e=>{ upload([...e.target.files]); e.target.value=""; };
["dragover","dragleave","drop"].forEach(t=>$("#drop").addEventListener(t,e=>{e.preventDefault(); $("#drop").classList.toggle("over",t==="dragover"); if(t==="drop") upload([...e.dataTransfer.files]);}));
load();
</script>
</body>
</html>
