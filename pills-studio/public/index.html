<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glance Pills Studio</title>
<link rel="stylesheet" href="fonts.css">
<script src="vendor/jszip.min.js"></script>
<style>
  :root{
    --bg:#f4f3f6; --panel:#fff; --ink:#15131a; --muted:#6c6877; --line:#dcd8e4;
    --accent:#6b3df0; --accent-ink:#fff; --warn:#d6322e; --ok:#1c8a4f;
  }
  *{box-sizing:border-box;border-radius:0!important}
  html,body{margin:0;height:100%}
  body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0}
  header small{color:var(--muted)}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .btn{border:1px solid var(--ink);background:var(--panel);padding:8px 12px;font-weight:600}
  .btn:hover{background:#eee}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:#5a2fd6}
  .btn.small{padding:4px 8px;font-size:12px}
  main{display:grid;grid-template-columns:240px minmax(320px,1fr) 360px;height:calc(100vh - 54px)}
  aside,section{overflow:auto}
  #list{background:var(--panel);border-right:1px solid var(--line);padding:12px}
  #stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:#555;min-width:0}
  #ctrl{background:var(--panel);border-left:1px solid var(--line);padding:14px}
  .newrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
  .item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid transparent;cursor:pointer}
  .item:hover{background:#f1eef8}
  .item.sel{border-color:var(--accent);background:#f1eef8}
  .item canvas{display:block;background:#ddd;flex:none}
  .item .meta{min-width:0;font-size:12px;line-height:1.3}
  .item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta span{color:var(--muted)}
  .empty{color:var(--muted);padding:12px 4px}
  #preview{display:block;box-shadow:0 8px 30px rgba(0,0,0,.35);touch-action:none;background:#222}
  .hint{color:#ddd;font-size:12px;text-align:center;max-width:420px}
  .stagebar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  fieldset{border:0;border-top:1px solid var(--line);margin:0 0 14px;padding:12px 0 0}
  legend{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px 0 0}
  label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:8px}
  textarea{resize:vertical}
  input[type=range]{width:100%}
  input[type=color]{width:42px;height:30px;padding:0;border:1px solid var(--line);background:#fff}
  .row{display:flex;gap:8px;align-items:center}
  .seg{display:flex}
  .seg button{flex:1;border:1px solid var(--line);background:#fff;padding:7px 4px;font-size:12px;font-weight:600;margin-left:-1px}
  .seg button:first-child{margin-left:0}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);position:relative}
  .sw button{height:34px;padding:0;border:2px solid #fff;outline:1px solid var(--line)}
  .sw button.on{outline:2px solid var(--ink)}
  .suggest{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .suggest button{border:1px solid var(--line);background:#fff;padding:4px;text-align:left;font-size:11px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
  .suggest button i{display:block;height:34px;width:100%}
  .suggest button b{font-weight:700}
  .suggest button em{font-style:normal;color:var(--muted);font-size:10px}
  .suggest button.on{border:2px solid var(--ink);padding:3px}
  .suggest .none{grid-column:1/-1;color:var(--muted);font-size:12px}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .swatches button{border:1px solid var(--line);background:#fff;padding:4px;text-align:left;font-size:10px;line-height:1.25;display:flex;flex-direction:column;gap:3px}
  .swatches button i{display:block;height:26px;width:100%}
  .swatches button b{font-weight:600}
  .swatches button em{font-style:normal;color:var(--muted);font-family:ui-monospace,monospace;font-size:9px}
  .swatches button.on{border:2px solid var(--ink);padding:3px}
  .swatches button:disabled{opacity:.45;cursor:default}
  .swatches button:disabled i{background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 4px 8px)!important}
  .rules{background:#f7f5fb;border:1px solid var(--line);padding:8px 10px;font-size:12px;line-height:1.45;color:#3c3846}
  .rules ul{margin:4px 0 0;padding-left:16px}
  .count{font-size:12px;font-weight:700}
  .count.bad{color:var(--warn)} .count.good{color:var(--ok)}
  .mascots{display:flex;flex-wrap:wrap;gap:6px}
  .mascots button{width:44px;height:44px;padding:2px;background:#f1eef8;border:1px solid var(--line)}
  .mascots button.on{border:2px solid var(--ink)}
  .mascots img,.mascots canvas{width:100%;height:100%;object-fit:contain;display:block}
  .drop{border:1px dashed var(--muted);padding:12px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer}
  .drop:hover{background:#f7f5fb}
  [hidden]{display:none!important}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  @media (max-width:1000px){
    main{grid-template-columns:1fr;height:auto}
    #list{border-right:0;border-bottom:1px solid var(--line)}
    #ctrl{border-left:0}
  }
</style>
</head>
<body>
<header>
  <h1>Glance Pills Studio</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <small id="saveState">Saved in this browser</small>
  <button class="btn" id="btnPNG">Download PNG</button>
  <button class="btn primary" id="btnZip">Download all (ZIP)</button>
</header>

<main>
  <aside id="list">
    <div class="newrow">
      <button class="btn small" data-new="image9">+ 9:16</button>
      <button class="btn small" data-new="image45">+ 4:5</button>
      <button class="btn small" data-new="prompt">+ Prompt</button>
    </div>
    <div id="items"></div>
  </aside>

  <section id="stage">
    <canvas id="preview"></canvas>
    <div class="stagebar">
      <button class="btn small" id="btnPrev" title="Previous card">← Prev</button>
      <span id="pos" style="color:#ddd;font-size:12px;align-self:center;min-width:46px;text-align:center"></span>
      <button class="btn small" id="btnNext" title="Next card">Next →</button>
      <button class="btn small" id="btnDup">Duplicate</button>
      <button class="btn small" id="btnDel">Delete</button>
    </div>
    <div class="hint" id="stageHint"></div>
  </section>

  <aside id="ctrl">
    <fieldset>
      <legend>Card</legend>
      <label>Format</label>
      <div class="seg" data-k="type">
        <button data-v="image9">Image 9:16</button>
        <button data-v="image45">Image 4:5</button>
        <button data-v="prompt">Prompt 1:1</button>
      </div>
      <div class="row">
        <div style="flex:1"><label>Segment</label>
          <select data-k="segment"><option value="female">Female</option><option value="male">Male</option><option value="neutral">Neutral</option></select></div>
        <div style="flex:1"><label>Category</label>
          <input type="text" data-k="category" list="cats" placeholder="Skincare"></div>
      </div>
      <datalist id="cats"><option>Grooming</option><option>Skincare</option><option>Haircare</option><option>Makeup</option><option>Fashion</option><option>Accessories</option><option>Fitness</option><option>Travel</option><option>Gifts</option><option>Tech</option><option>Pets</option><option>Home decor</option></datalist>
    </fieldset>

    <fieldset data-for="image9 image45">
      <legend>Treatment</legend>
      <select data-k="treatment" id="treatment"></select>
      <div class="rules" id="rules" style="margin-top:8px"></div>
    </fieldset>

    <fieldset data-for="image9 image45">
      <legend>Image</legend>
      <div class="drop" id="drop">Click, drop or paste an image</div>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn small" id="btnLibImg" style="margin-top:6px;width:100%">Choose from the shared library…</button>
      <label>Zoom</label><input type="range" data-k="zoom" min="1" max="3" step="0.01">
      <label>Position X</label><input type="range" data-k="ox" min="-1" max="1" step="0.01">
      <label>Position Y</label><input type="range" data-k="oy" min="-1" max="1" step="0.01">
      <label>Gradient colour <span style="font-weight:400;color:var(--muted)">(picked from the image)</span></label>
      <div class="suggest" id="suggest"></div>
      <details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;font-weight:600">All palette colours</summary>
        <div class="swatches" id="swatches" style="margin-top:6px"></div></details>
      <div class="row" style="margin-top:8px">
        <input type="color" data-k="scrimColor" id="scrimColor" title="Custom colour">
        <span id="swatchHint" style="font-size:12px;color:var(--muted)">Custom colour</span>
      </div>
      <label>Gradient height</label><input type="range" data-k="scrimH" min="25" max="80" step="1">
    </fieldset>

    <fieldset data-for="image9 image45">
      <legend>Copy</legend>
      <label>Small line above <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input type="text" data-k="kicker" placeholder="Find">
      <label>Headline <span style="font-weight:400;color:var(--muted)">(Enter = line break)</span></label>
      <textarea data-k="headline" rows="2" placeholder="Matcha mask"></textarea>
      <label>Small line below <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input type="text" data-k="sub" placeholder="For your skin">
      <label>Alignment</label>
      <div class="seg" data-k="align"><button data-v="left">Bottom left</button><button data-v="right">Bottom right</button></div>
      <div class="count" id="wc" style="margin-top:8px"></div>
      <button class="btn small" id="btnSplit" style="margin-top:8px;width:100%" title="Type or paste one full line into the headline, then click">Auto-split one line into the 3 levels</button>
    </fieldset>

    <fieldset data-for="prompt">
      <legend>Prompt card</legend>
      <label>Question <span style="font-weight:400;color:var(--muted)">(written how a user would type it)</span></label>
      <textarea data-k="question" rows="3" placeholder="Two underrated hacks to find your undertone"></textarea>
      <label>Category subtext <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input type="text" data-k="subtext" placeholder="Skincare">
      <label>Colour</label>
      <div class="seg sw" data-k="palette" id="palette"></div>
      <label>Mascot</label>
      <div class="mascots" id="mascots"></div>
      <div class="count" id="wcp" style="margin-top:8px"></div>
    </fieldset>

    <fieldset data-for="image9 image45">
      <legend>Need an image?</legend>
      <a class="btn" id="genLink" href="generate" style="display:block;text-align:center;text-decoration:none">Generate one for this card →</a>
    </fieldset>
  </aside>
</main>
<div id="toast"></div>

<script src="shared.js"></script>
<script src="palette.js"></script>
<script src="render.js"></script>
<script>
"use strict";
/* ---------- Strategy data ---------- */
const { SIZES, TYPE_LABEL, PALETTES, getImg, loadImg, paletteFor, gradientColor, coverRect, render, drawMascotDefault } = CR;
const MAX_WORDS = 7;
const EXPORT_SCALE = 4;
const PREVIEW_SCALE = 2;

const TREATMENTS = PS.TREATMENTS;

/* ---------- State ---------- */
const STORE_KEY = "pillsStudio.v2";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = CR.uid;
let state = { cards:[] }, sel = null;
const cur = () => state.cards.find(c=>c.id===sel);

const blank = CR.blank;
function seed(){
  const now=Date.now();
  const a = Object.assign(blank("image9"),{segment:"male",category:"Skincare",treatment:"playful",kicker:"Find",headline:"Matcha\nmask",sub:"For your skin",align:"right",createdAt:now});
  const b = Object.assign(blank("image45"),{segment:"male",category:"Fitness",treatment:"hero",headline:"5 gym\ngo-tos",sub:"For a beginner",createdAt:now-1000});
  const c = Object.assign(blank("prompt"),{segment:"female",category:"Skincare",question:"Two under-\nrated hacks to find your undertone",createdAt:now-2000});
  return [a,b,c];
}
function normalize(c){ const o=Object.assign(blank(c.type||"image9"),c); if(o.scrimAuto===false&&!c.scrimSource) o.scrimSource="custom"; delete o.scrimAuto; if(typeof o.mascot!=="string") o.mascot=""; if(typeof o.img!=="string") o.img=null; return o; }

/* Cards are shared through the API when it is available, otherwise kept in this browser. */
const Store = {
  remote:false, timers:new Map(), dirty:new Set(), lt:0,
  setStatus(t){ $("#saveState").textContent=t; },
  async init(){
    const cfg=await PS.config();
    this.remote=!cfg.offline;
    if(this.remote){
      try{
        let cards=(await PS.api("/api/cards")).cards;
        if(!cards.length){ cards=seed(); await Promise.all(cards.map(c=>PS.api("/api/cards",{method:"PUT",body:{card:c}}))); }
        state.cards=cards.map(normalize); this.setStatus("Shared with everyone"); return;
      }catch(e){ this.remote=false; toast("Shared storage unavailable. Working in this browser only."); }
    }
    let s=null; try{ s=JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
    state.cards=(s&&s.cards&&s.cards.length?s.cards:seed()).map(normalize);
    this.setStatus("Saved in this browser only");
  },
  saveCard(c){
    if(!c) return;
    if(!this.remote){
      clearTimeout(this.lt);
      this.lt=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); this.setStatus("Saved in this browser only"); }catch(e){ this.setStatus("Browser storage full. Download your cards."); } },300);
      return;
    }
    this.dirty.add(c.id); this.setStatus("Saving…");
    clearTimeout(this.timers.get(c.id));
    this.timers.set(c.id,setTimeout(async()=>{
      try{ await PS.api("/api/cards",{method:"PUT",body:{card:c}}); this.dirty.delete(c.id); if(!this.dirty.size) this.setStatus("Saved · shared with everyone"); }
      catch(e){ this.setStatus("Couldn't save: "+e.message); }
    },500));
  },
  async deleteCard(id){
    if(!this.remote) return this.saveCard({id});
    clearTimeout(this.timers.get(id)); this.dirty.delete(id);
    try{ await PS.api("/api/cards?id="+id,{method:"DELETE"}); this.setStatus("Deleted"); }catch(e){ toast("Couldn't delete: "+e.message); }
  },
  async reload(){
    if(!this.remote||this.dirty.size) return;
    try{
      const keep=sel; state.cards=(await PS.api("/api/cards")).cards.map(normalize);
      sel=state.cards.some(c=>c.id===keep)?keep:state.cards[0]?.id;
      buildList(); if(cur()){ syncUI(); refresh(); }
    }catch(e){}
  }
};
function save(c){ Store.saveCard(c||cur()); }

let redrawQ=false;
function scheduleRedraw(){ if(redrawQ) return; redrawQ=true; requestAnimationFrame(()=>{ redrawQ=false; drawPreview(); state.cards.forEach(drawThumb); renderSwatches(); }); }
CR.onImageLoad=scheduleRedraw;

/* ---------- UI ---------- */
const preview=$("#preview");
function wordCount(c){ return [c.kicker,c.headline,c.sub].join(" ").trim().split(/\s+/).filter(Boolean).length; }
function cardLabel(c){ const t=(c.type==="prompt"?c.question:c.headline||"").replace(/\n/g," ").trim(); return t||"Untitled"; }

function drawPreview(){
  const c=cur(); if(!c) return;
  const [W,H]=SIZES[c.type], dpr=window.devicePixelRatio||1;
  render(c,preview,PREVIEW_SCALE*dpr);
  preview.style.width=W*PREVIEW_SCALE+"px"; preview.style.height=H*PREVIEW_SCALE+"px";
  preview.style.cursor = c.type!=="prompt"&&c.img ? "grab":"default";
  const n=wordCount(c), wc=$("#wc");
  const issues=PS.copyIssues(c,MAX_WORDS);
  wc.textContent=`${n} / ${MAX_WORDS} words`+(issues.length?" · "+issues.filter(m=>!/words \(max/.test(m)).join(" · "):""); wc.className="count "+(issues.length?"bad":"good");
  const q=(c.question||"").trim().split(/\s+/).filter(Boolean).length;
  $("#wcp").textContent=`${q} words`; $("#wcp").className="count";
  $("#genLink").href="generate?"+new URLSearchParams({treatment:c.treatment,segment:c.segment,category:c.category});
  $("#stageHint").textContent = c.type==="prompt" ? "Text-led card with the Glance mascot. Tapping it sends the question straight into the chat."
    : "Drag the image to reposition. Text sits bottom left or bottom right only.";
}
const thumbs=new Map();
function drawThumb(c){ const cv=thumbs.get(c.id); if(cv){ render(c,cv,.6); const lab=cv.parentElement.querySelector("b"); if(lab) lab.textContent=cardLabel(c); } }
function updatePos(){ const i=state.cards.findIndex(c=>c.id===sel); $("#pos").textContent=i<0?"":`${i+1} / ${state.cards.length}`; $("#btnPrev").disabled=i<=0; $("#btnNext").disabled=i<0||i>=state.cards.length-1; }
function go(d){ const i=state.cards.findIndex(c=>c.id===sel), n=state.cards[i+d]; if(!n) return; sel=n.id; buildList(); syncUI(); refresh(); document.querySelector(".item.sel")?.scrollIntoView({block:"nearest"}); }
function refresh(){ drawPreview(); const c=cur(); if(c) drawThumb(c); updatePos(); }

function buildList(){
  const box=$("#items"); box.innerHTML=""; thumbs.clear();
  if(!state.cards.length){ box.innerHTML='<div class="empty">No cards yet. Add one above.</div>'; return; }
  for(const c of state.cards){
    const d=document.createElement("div"); d.className="item"+(c.id===sel?" sel":""); d.dataset.id=c.id;
    const cv=document.createElement("canvas"); thumbs.set(c.id,cv);
    const meta=document.createElement("div"); meta.className="meta";
    meta.innerHTML=`<b></b><span>${TYPE_LABEL[c.type]} · ${c.segment}${c.category?" · "+c.category.replace(/</g,""):""}</span>`;
    d.append(cv,meta); box.append(d); drawThumb(c);
    d.onclick=()=>{ sel=c.id; buildList(); syncUI(); refresh(); };
  }
}
function syncUI(){
  const c=cur(); if(!c) return;
  $$("#ctrl [data-for]").forEach(el=>el.hidden=!el.dataset.for.split(" ").includes(c.type));
  $$("#ctrl [data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.classList.contains("seg")) $$(`[data-k="${k}"] button`).forEach(b=>b.classList.toggle("on",b.dataset.v===String(c[k])));
    else if(el.type==="checkbox") el.checked=!!c[k];
    else el.value=c[k]??"";
  });
  const t=TREATMENTS[c.treatment]||TREATMENTS.contrejour;
  $("#rules").innerHTML=`<b>${t.name}</b><br>${t.style}<ul>${t.rules.map(r=>`<li>${r}</li>`).join("")}</ul>`;
  renderMascots(); renderSwatches();
}
const SW_LABEL={dominant:"Dominant",darkVibrant:"Dark Vibrant",vibrant:"Vibrant",lightVibrant:"Light Vibrant",darkMuted:"Dark Muted",muted:"Muted",lightMuted:"Light Muted"};
function renderSwatches(){
  const c=cur(), box=$("#swatches"); if(!c||!box) return;
  const pal=c.type==="prompt"?null:paletteFor(c.img);
  const sg=$("#suggest"); sg.innerHTML="";
  if(pal&&pal.suggestions&&pal.suggestions.length){
    pal.suggestions.forEach((s,i)=>{
      const b=document.createElement("button"), key="sugg"+(i+1);
      b.dataset.s=key; b.className=c.scrimSource===key?"on":""; b.title=`${s.label} ${s.hex}`;
      b.innerHTML=`<i style="background:${s.hex}"></i><b>Option ${i+1}</b><em>${s.label} · ${s.hex}</em>`;
      sg.append(b);
    });
  } else sg.innerHTML=`<div class="none">${c.img?"No usable colours found. Use a custom colour.":"Add an image and 3 colour options appear here."}</div>`;
  box.innerHTML="";
  for(const k of Palette.NAMES){
    const sw=pal&&pal[k], b=document.createElement("button");
    b.dataset.s=k; b.disabled=!sw; b.className=c.scrimSource===k?"on":"";
    b.title=sw?`${SW_LABEL[k]} ${sw.hex}`:`${SW_LABEL[k]}: no matching colour in this image`;
    b.innerHTML=`<i style="background:${sw?sw.hex:"#eee"}"></i><b>${SW_LABEL[k]}</b><em>${sw?sw.hex:"none"}</em>`;
    box.append(b);
  }
  const col=gradientColor(c,getImg(c.img),170,310), lum=(0.2126*col[0]+0.7152*col[1]+0.0722*col[2])/255;
  const m=/^sugg(\d)$/.exec(c.scrimSource);
  $("#swatchHint").textContent = !c.img ? "Add an image to read its palette."
    : lum>0.55 ? "This colour is light; white text may be hard to read. Try another option."
    : c.scrimSource==="custom" ? "Custom colour" : m ? "Using Option "+m[1]+"." : "Using "+(SW_LABEL[c.scrimSource]||"Dominant")+".";
}
function pickSwatch(e){
  const b=e.target.closest("button[data-s]"); if(!b||b.disabled) return;
  const c=cur(); c.scrimSource=b.dataset.s; renderSwatches(); refresh(); save(c);
}
$("#suggest").addEventListener("click",pickSwatch);
$("#swatches").addEventListener("click",pickSwatch);
function renderMascots(){
  const c=cur(); const box=$("#mascots"); box.innerHTML="";
  const mk=(url,inner)=>{ const b=document.createElement("button"); b.className=(url===c.mascot)?"on":""; b.append(inner); b.onclick=()=>{ c.mascot=url; renderMascots(); refresh(); save(c); }; box.append(b); };
  const dc=document.createElement("canvas"); dc.width=dc.height=88; drawMascotDefault(dc.getContext("2d"),4,4,80); mk("",dc);
  if(c.mascot){ const im=new Image(); im.src=c.mascot; mk(c.mascot,im); }
  const lib=document.createElement("button"); lib.textContent="Library…"; lib.title="Choose a mascot from the shared library";
  lib.style.cssText="width:auto;padding:0 12px;font-size:12px;font-weight:600";
  lib.onclick=async()=>{ const it=await PS.pickAsset(["mascot"],"Choose a mascot"); if(it){ c.mascot=it.url; renderMascots(); refresh(); save(c); } };
  box.append(lib);
}

/* ---------- Events ---------- */
document.addEventListener("input",e=>{
  const el=e.target.closest("#ctrl [data-k]"); if(!el||el.classList.contains("seg")) return;
  const c=cur(), k=el.dataset.k;
  c[k]= el.type==="checkbox"?el.checked : el.type==="range"?parseFloat(el.value) : el.value;
  if(k==="scrimColor"){ c.scrimSource="custom"; renderSwatches(); }
  if(k==="treatment") syncUI();
  if(k==="segment"||k==="category") buildList(); else refresh();
  save();
});
document.addEventListener("click",e=>{
  const b=e.target.closest(".seg button"); if(b){
    const c=cur(), k=b.parentElement.dataset.k; c[k]=b.dataset.v;
    if(k==="type") buildList();
    syncUI(); refresh(); save(); return;
  }
  const n=e.target.closest("[data-new]"); if(n){
    const c=blank(n.dataset.new); if(c.type==="prompt") c.palette="purple";
    state.cards.unshift(c); sel=c.id; buildList(); syncUI(); refresh(); save();
  }
});
$("#btnSplit").onclick=()=>{
  const c=cur(); if(!c||c.type==="prompt") return;
  const s=PS.splitCopy([c.kicker,c.headline.replace(/\n/g," "),c.sub].filter(Boolean).join(" "));
  c.kicker=s.kicker; c.headline=s.headline; c.sub=s.sub; syncUI(); refresh(); save(c);
};
$("#btnPrev").onclick=()=>go(-1); $("#btnNext").onclick=()=>go(1);
$("#btnDup").onclick=()=>{ const c=cur(); if(!c) return; const d=JSON.parse(JSON.stringify(c)); d.id=uid(); d.createdAt=Date.now(); state.cards.unshift(d); sel=d.id; buildList(); syncUI(); refresh(); save(d); };
$("#btnDel").onclick=()=>{ const c=cur(); if(!c||!confirm("Delete this card for everyone?")) return; const i=state.cards.indexOf(c); state.cards.splice(i,1); sel=state.cards[Math.min(i,state.cards.length-1)]?.id; buildList(); if(cur()){syncUI();refresh();} else {const x=preview.getContext("2d");x.clearRect(0,0,preview.width,preview.height);} Store.deleteCard(c.id); if(!Store.remote) save(c); };

// palette swatches
$("#palette").innerHTML=Object.entries(PALETTES).map(([k,p])=>`<button data-v="${k}" title="${p.label} ${p.brand}" style="background:linear-gradient(135deg,${p.from},${p.to})"></button>`).join("");
$("#treatment").innerHTML=Object.entries(TREATMENTS).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");

// image upload / drop / paste / library
function applyImage(c,url){ c.img=url; c.zoom=1; c.ox=0; c.oy=0; syncUI(); refresh(); save(c); }
async function setImageFile(file){
  const c=cur(); if(!c||c.type==="prompt"||!file) return;
  try{ toast("Uploading…"); const it=await PS.uploadFile("image",file); applyImage(c,it.url); toast(it.offline?"Image added":"Added to the shared library"); }
  catch(e){ toast(e.message); }
}
$("#drop").onclick=()=>$("#file").click();
$("#file").onchange=e=>{ setImageFile(e.target.files[0]); e.target.value=""; };
$("#btnLibImg").onclick=async()=>{ const c=cur(); if(!c||c.type==="prompt") return; const it=await PS.pickAsset(["image","generated"],"Choose an image"); if(it) applyImage(c,it.url); };
["dragover","drop"].forEach(t=>document.addEventListener(t,e=>{ e.preventDefault(); if(t==="drop") setImageFile(e.dataTransfer.files[0]); }));
document.addEventListener("paste",e=>{ const f=[...(e.clipboardData?.files||[])][0]; if(f) setImageFile(f); });

// drag to reposition
let drag=null;
preview.addEventListener("pointerdown",e=>{ const c=cur(); const img=c&&c.type!=="prompt"&&getImg(c.img); if(!img) return; drag={x:e.clientX,y:e.clientY,ox:c.ox,oy:c.oy}; preview.setPointerCapture(e.pointerId); preview.style.cursor="grabbing"; });
preview.addEventListener("pointermove",e=>{
  if(!drag) return; const c=cur(), [W,H]=SIZES[c.type], r=coverRect(getImg(c.img),c,W,H);
  const dx=(e.clientX-drag.x)/PREVIEW_SCALE, dy=(e.clientY-drag.y)/PREVIEW_SCALE;
  if(r.dw>W+.5) c.ox=Math.max(-1,Math.min(1,drag.ox+dx/((r.dw-W)/2)));
  if(r.dh>H+.5) c.oy=Math.max(-1,Math.min(1,drag.oy+dy/((r.dh-H)/2)));
  $('[data-k="ox"]').value=c.ox; $('[data-k="oy"]').value=c.oy; refresh();
});
preview.addEventListener("pointerup",()=>{ if(drag){drag=null;preview.style.cursor="grab";save();} });

document.addEventListener("keydown",e=>{ if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();go(1);} if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();go(-1);} });

/* ---------- Export ---------- */
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
function fileName(c,i){ return [i!=null?String(i+1).padStart(2,"0"):"",c.segment,TYPE_LABEL[c.type].replace(":","x"),slug(c.category),slug(cardLabel(c))].filter(Boolean).join("_")+".png"; }
async function toBlob(c){ await Promise.all([loadImg(c.img),loadImg(c.mascot)]); const cv=document.createElement("canvas"); render(c,cv,EXPORT_SCALE); return new Promise(r=>cv.toBlob(r,"image/png")); }
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function warnLong(list){ const n=list.filter(c=>c.type!=="prompt"&&wordCount(c)>MAX_WORDS).length; if(n) toast(`${n} card${n>1?"s":""} over ${MAX_WORDS} words`); }
$("#btnPNG").onclick=async()=>{ const c=cur(); if(!c) return; download(await toBlob(c),fileName(c)); warnLong([c]); };
$("#btnZip").onclick=async()=>{
  if(!window.JSZip) return toast("ZIP library failed to load – use Download PNG");
  const z=new JSZip(); for(let i=0;i<state.cards.length;i++) z.file(fileName(state.cards[i],i),await toBlob(state.cards[i]));
  download(await z.generateAsync({type:"blob"}),"starter-pills.zip"); warnLong(state.cards);
};

/* ---------- Boot ---------- */
(async()=>{
  PS.nav("studio");
  await Store.init();
  const p=new URLSearchParams(location.search);
  if(p.get("new")){
    const t=["image9","image45","prompt"].includes(p.get("new"))?p.get("new"):"image9", c=blank(t);
    if(["female","male","neutral"].includes(p.get("segment"))) c.segment=p.get("segment");
    if(PS.TREATMENTS[p.get("treatment")]) c.treatment=p.get("treatment");
    c.category=(p.get("category")||"").slice(0,60);
    const img=p.get("img"); if(img&&(img.startsWith("https://")||img.startsWith("/files/"))) c.img=img;
    state.cards.unshift(c); sel=c.id; save(c); history.replaceState(null,"","./");
  } else sel=(state.cards.some(c=>c.id===p.get("open"))?p.get("open"):state.cards[0]?.id);
  if(p.get("open")) history.replaceState(null,"","./");
  buildList(); syncUI(); refresh(); document.querySelector(".item.sel")?.scrollIntoView({block:"nearest"});
  Promise.all([400,600,900].map(w=>document.fonts.load(`${w} 16px "DM Sans"`))).then(()=>{ buildList(); refresh(); }).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") Store.reload(); });
})();
</script>
</body>
</html>
